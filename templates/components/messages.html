{% if messages %}
<div class="messages-container" style="position:fixed;top:84px;right:1.5rem;z-index:2000;display:flex;flex-direction:column;gap:0.75rem;max-width:400px;width:calc(100% - 3rem);" aria-live="polite" aria-atomic="false">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% elif message.tags == 'success' %}success{% else %}info{% endif %}" role="alert">
      <span>
        {% if message.tags == 'success' %}✓{% elif message.tags == 'error' %}✕{% elif message.tags == 'warning' %}⚠{% else %}ℹ{% endif %}
      </span>
      <span>{{ message }}</span>
      <button type="button" class="alert-close" aria-label="Schließen">×</button>
    </div>
  {% endfor %}
</div>
{% endif %}

{% load static %}
<!DOCTYPE html>
<!-- data-rw-no-consent: interne Seite, nie ein Cookie-Banner (siehe components/rw_cookie_banner.html) -->
<html lang="de" data-rw-no-consent>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>// ACCESS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --g: #00ff88;
      --g2: #16a34a;
      --g3: #052e16;
      --bg: #030712;
      --bg2: #0a0f1a;
      --card: rgba(0,255,136,0.03);
      --border: rgba(0,255,136,0.15);
      --text: #e2e8f0;
      --muted: #475569;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* svh statt vh: Auf dem Handy zaehlt vh die Flaeche OHNE eingeblendete
         Adressleiste mit – die Karte ragte darunter. */
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: var(--font-body);
      padding: 20px;
      /* Frueher overflow:hidden. Damit war die Seite auf dem Handy nicht
         scrollbar: Passte die Karte nicht in den Viewport, kam man an den
         Absenden-Knopf nicht heran – die Login-Seite war dort unbedienbar.
         Zum Beschneiden war die Regel nie noetig, .orb ist position:fixed
         und vergroessert den Scrollbereich ohnehin nicht. */
      overflow-x: hidden;
      position: relative;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Glow orb */
    .orb {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,136,0.07) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse-orb 4s ease-in-out infinite;
    }
    @keyframes pulse-orb {
      0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      /* margin:auto statt allein align-items:center – ein zentriertes
         Flex-Item, das hoeher als der Container ist, laesst sich sonst nach
         oben hin nicht mehr wegscrollen. */
      margin: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 40px 36px 36px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(0,255,136,0.05), inset 0 1px 0 rgba(0,255,136,0.1);
      animation: fade-in 0.6s ease both;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .corner {
      position: absolute;
      width: 12px; height: 12px;
      border-color: var(--g);
      border-style: solid;
    }
    .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--g);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .status-dot {
      width: 6px; height: 6px;
      background: var(--g);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--g);
      animation: blink 1.2s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    h1 {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    h1 span { color: var(--g); }
    .subtitle {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 32px;
      font-family: var(--font-mono);
    }

    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--g);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    input[type=text], input[type=password] {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      transition: border-color 200ms, box-shadow 200ms;
      caret-color: var(--g);
    }
    input:focus {
      border-color: var(--g);
      box-shadow: 0 0 0 2px rgba(0,255,136,0.12), 0 0 20px rgba(0,255,136,0.05);
    }
    input::placeholder { color: #334155; }

    .error {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 2px;
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #fca5a5;
      margin-bottom: 18px;
    }
    .error::before { content: '!'; font-weight: 800; }

    button[type=submit] {
      width: 100%;
      background: transparent;
      border: 1px solid var(--g);
      border-radius: 2px;
      color: var(--g);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
      transition: background 200ms, box-shadow 200ms, color 200ms;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    button[type=submit]::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--g);
      transform: translateX(-100%);
      transition: transform 300ms ease;
      z-index: 0;
    }
    button[type=submit]:hover::before { transform: translateX(0); }
    button[type=submit]:hover { color: #030712; box-shadow: 0 0 20px rgba(0,255,136,0.3); }
    button[type=submit] span { position: relative; z-index: 1; }

    @media (max-width: 420px) {
      body { padding: 14px; }
      .card { padding: 28px 20px 24px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <!-- Bewusst OHNE components/rw_nav.html, components/rw_js.html und
       static/css/ruempelwerk.css: Das ist der interne Bereich mit eigenem
       Design. Die oeffentlichen Bausteine legten eine fixe Navbar (72px),
       die Mobile-Bottom-Nav, den Cookie-Banner und das WhatsApp-Popup
       ueber diese Seite und machten sie unbedienbar. Nicht wieder einfuegen. -->
  <div class="orb"></div>
  <div class="card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="status-line">
      <div class="status-dot"></div>
      <span>RÜMPELWERK // ANALYTICS</span>
    </div>

    <h1>// <span>ACCESS</span></h1>
    <p class="subtitle">Authentifizierung erforderlich_</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="username">» Benutzer</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required placeholder="user@terminal">
      </div>
      <div class="field">
        <label for="password">» Passwort</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••••••">
      </div>
      <button type="submit"><span>ZUGANG ANFORDERN →</span></button>
    </form>
  </div>
</body>
</html>
